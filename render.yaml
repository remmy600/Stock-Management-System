services:
  - type: web
    name: ububiko-smart-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: https://ububikobwawe.netlify.app,https://genzura-ububiko-bwawe.vercel.app,http://127.0.0.1:5500,http://localhost:5500
      - key: JWT_EXPIRES_IN
        value: 8h
